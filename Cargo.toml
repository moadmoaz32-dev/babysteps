[package]
name = "plutus_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
mimalloc = "0.1.32"
ark-ec = "0.4.0"
ark-ff = "0.4.0"
ark-secp256k1 = "0.4.0"
bs58 = "0.5.0"
clap = { version = "4.4.11", features = ["derive"] }
hex = "0.4.3"
rand = "0.8.5"
rand_xoshiro = "0.6.0"
ripemd = "0.1.3"
sha2 = "0.10.8"
ctrlc = "3.4"
rayon = "1.8.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
